<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calendar-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            padding: 25px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .calendar-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            position: relative;
        }

        .day:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        .day.inactive {
            color: #475569;
            background: transparent;
            cursor: default;
        }

        .day.inactive:hover {
            transform: none;
        }

        .day.today {
            background: #3b82f6;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .day.has-event::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 5px;
            height: 5px;
            background-color: #f43f5e;
            border-radius: 50%;
        }

        /* Modal барои қайдҳо */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-content h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .modal-content textarea {
            width: 100%;
            height: 100px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            resize: none;
            margin-bottom: 15px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-buttons button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save {
            background: #3b82f6;
            color: white;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <button class="nav-btn" id="prev-btn">&#10094;</button>
            <h2 id="month-year"></h2>
            <button class="nav-btn" id="next-btn">&#10095;</button>
        </div>

        <div class="weekdays">
            <div>Ду</div>
            <div>Сш</div>
            <div>Чш</div>
            <div>Пш</div>
            <div>Ҷм</div>
            <div>Шб</div>
            <div>Як</div>
        </div>

        <div class="days-grid" id="days-grid"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="event-modal">
        <div class="modal-content">
            <h3 id="modal-date-title">Қайд барои рӯз</h3>
            <textarea id="event-text" placeholder="Қайди худро нависед..."></textarea>
            <div class="modal-buttons">
                <button class="btn-close" id="close-modal">Бекор кардан</button>
                <button class="btn-save" id="save-event">Сабт кардан</button>
            </div>
        </div>
    </div>

    <script>
        const monthYearEl = document.getElementById('month-year');
        const daysGridEl = document.getElementById('days-grid');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        const modal = document.getElementById('event-modal');
        const modalDateTitle = document.getElementById('modal-date-title');
        const eventText = document.getElementById('event-text');
        const closeModalBtn = document.getElementById('close-modal');
        const saveEventBtn = document.getElementById('save-event');

        let currentDate = new Date();
        let selectedDateStr = '';
        let events = JSON.parse(localStorage.getItem('nexus_events')) || {};

        const months = [
            "Январ", "Феврал", "Март", "Апрел", "Май", "Июн",
            "Июл", "Август", "Сентябр", "Октябр", "Ноябр", "Декабр"
        ];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearEl.textContent = `${months[month]} ${year}`;
            daysGridEl.innerHTML = '';

            // Рӯзи якуми моҳ ва миқдори рӯзҳо
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Душанбе ҳамчун саршавӣ
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();

            // Рӯзҳои моҳи қаблӣ
            for (let i = firstDayIndex; i > 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day', 'inactive');
                dayDiv.textContent = prevTotalDays - i + 1;
                daysGridEl.appendChild(dayDiv);
            }

            // Рӯзҳои моҳи ҷорӣ
            const today = new Date();
            for (let i = 1; i <= totalDays; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');
                dayDiv.textContent = i;

                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;

                // Санҷиши рӯзи имрӯз
                if (
                    i === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear()
                ) {
                    dayDiv.classList.add('today');
                }

                // Санҷиши мавҷудияти қайд
                if (events[dateStr]) {
                    dayDiv.classList.add('has-event');
                }

                // Кушодани модал ҳангоми пахш
                dayDiv.addEventListener('click', () => {
                    selectedDateStr = dateStr;
                    modalDateTitle.textContent = `Қайд: ${i} ${months[month]} ${year}`;
                    eventText.value = events[dateStr] || '';
                    modal.style.display = 'flex';
                });

                daysGridEl.appendChild(dayDiv);
            }
        }

        prevBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        closeModalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        saveEventBtn.addEventListener('click', () => {
            if (eventText.value.trim() !== '') {
                events[selectedDateStr] = eventText.value.trim();
            } else {
                delete events[selectedDateStr];
            }
            localStorage.setItem('nexus_events', JSON.stringify(events));
            modal.style.display = 'none';
            renderCalendar();
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        renderCalendar();
    </script>
</body>
</html>
